paths:
  base_output_dir: "./data/"
  exp_output_dir: "light_background_300_01"
  test_output_dir: "Test"
  baseline_name: "Baseline"
  main_name: "Main"

fixed_params:
  t_fixation: 0.3
  t_stim: 0.3
  t_response: 1.35
  t_break: 5
  n_up: 1
  n_down: 1
  start_val: -0.5 # is the contrast the staircase starts with not the intensity
  background_val: 0.9
  step_sizes: [0.2,
              0.189,
              0.179,
              0.168,
              0.158,
              0.147,
              0.137,
              0.126,
              0.116,
              0.105,
              0.095,
              0.084,
              0.074,
              0.063,
              0.053,
              0.042,
              0.032,
              0.021,
              0.01]

  step_type: 'lin'
  reversals: 19 #15 #24 #22 #21 #1
  nullOdds: 0.1

exp_blocks:
  baseline:
    test_trials:  10 #50
    n_trials: 60
    n_blocks: 1
  #todo change the last 3 numbers to 1.0, 0.25, -0.25(300), (150),(100), (75), (50)

  main:
    test_trials: 50
    n_trials: 75 #50 minimal amount of trials per staircase (29 staircases = n_cond * n_intens + 1), n_trials per block = (nCondition * n_intens*n_trials + 0.2*n)/blocks)
    n_blocks: 12 #10 #7

    flanker_conditions:
      - label: "50"
        FC_factor: 0.5
      - label: "100"
        FC_factor: 1
      - label: "150"
        FC_factor: 1.5
      - label: "300"
        FC_factor: 3
      - label: "1000"
        FC_factor: 1000
        
# Kapadia uses 30' = 0.5° corresponds to ≈ 0.314 cm by width of 3' = 0.05 deg = 0.0314 cm, 1.65 px -> 2 px
# to get 0.5 deg we need around 16.5 pixels -> 18 px for symmetry
stimuli:
  target:
    - object: line
      type: target
      pos: [0, 0]
      angle: 90
      length: 18

  triple_flanker:
    - object: line
      type: flanker
      pos: [-27, 27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [0, 27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, 27]
      angle: 90
      length: 18

    - object: line
      type: flanker
      pos: [-27, 0]
      angle: 90
      length: 18
    - object: line
      type: target
      pos: [0, 0]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, 0]
      angle: 90
      length: 18

    - object: line
      type: flanker
      pos: [-27, -27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [0, -27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, -27]
      angle: 90
      length: 18

  triple_flanker_orth: # All orthogonal
    - object: line
      type: flanker
      pos: [-27, 27]
      angle: 0
      length: 18
    - object: line
      type: flanker
      pos: [0, 27]
      angle: 0
      length: 18
    - object: line
      type: flanker
      pos: [27, 27]
      angle: 0
      length: 18

    - object: line
      type: flanker
      pos: [-27, 0]
      angle: 0
      length: 18
    - object: line
      type: target
      pos: [0, 0]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, 0]
      angle: 0
      length: 18

    - object: line
      type: flanker
      pos: [-27, -27]
      angle: 0
      length: 18
    - object: line
      type: flanker
      pos: [0, -27]
      angle: 0
      length: 18
    - object: line
      type: flanker
      pos: [27, -27]
      angle: 0
      length: 18
  # # #------
  single_flanker_top:
  - object: line
    type: flanker
    pos: [0, 27]
    angle: 90
    length: 18
  - object: line
    type: target
    pos: [0, 0]
    angle: 90
    length: 18
  - object: line
    type: flanker
    pos: [0, -27]
    angle: 90
    length: 18
