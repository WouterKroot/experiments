paths:
  base_output_dir: "./data/"
  exp_output_dir: "dark_background_300_0004"
  test_output_dir: "Test"
  baseline_name: "Baseline"
  main_name: "Main"

fixed_params:
  t_fixation: 0.3
  t_stim: 0.3
  t_response: 1.35
  t_break: 5
  n_up: 1
  n_down: 1
  start_val: -0.4 # is the contrast the staircase starts with not the intensity, can stay -0.5 for both background conditions
  background_val: -0.8
  step_sizes: [0.1, 0.05, 0.012, 0.0114, 0.0108, 0.0102, 0.0096, 0.009, 0.0084, 0.0078, 0.0072, 0.0066,
             0.006, 0.0054, 0.0048, 0.0042, 0.0036, 0.003, 0.0024, 0.0018, 0.001, 0.0005, 0.00025]
  # step_sizes: [0.1,
  #             0.05,
  #             0.036,
  #             0.034,
  #             0.032,
  #             0.03,
  #             0.028,
  #             0.026,
  #             0.024,
  #             0.022,
  #             0.02,
  #             0.018,
  #             0.016,
  #             0.014,
  #             0.012,
  #             0.01,
  #             0.008,
  #             0.006,
  #             0.004,
  #             0.002,
  #             0.001,
  #             0.0005,
  #             0.0001]

  step_type: 'lin'
  reversals: 23 #15 #24 #22 #21 #1
  nullOdds: 0.1

exp_blocks:
  baseline:
    test_trials:  30 #50
    n_trials: 80
    n_blocks: 1
  #todo change the last 3 numbers to 1.0, 0.25, -0.25(300), (150),(100), (75), (50)

  main:
    test_trials: 50
    n_trials: 80 #50 minimal amount of trials per staircase (29 staircases = n_cond * n_intens + 1), n_trials per block = (nCondition * n_intens*n_trials + 0.2*n)/blocks)
    n_blocks: 10 #10 #7

    flanker_conditions:
      - label: "50"
        FC_factor: 0.5
      - label: "100"
        FC_factor: 1
      - label: "150"
        FC_factor: 1.5
      - label: "300"
        FC_factor: 3
      - label: "1000"
        FC_factor: 1000
        
# Kapadia uses 30' = 0.5° corresponds to ≈ 0.314 cm by width of 3' = 0.05 deg = 0.0314 cm, 1.65 px -> 2 px
# to get 0.5 deg we need around 16.5 pixels -> 18 px for symmetry
stimuli:
  target:
    - object: line
      type: target
      pos: [0, 0]
      angle: 90
      length: 18

  triple_flanker:
    - object: line
      type: flanker
      pos: [-27, 27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [0, 27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, 27]
      angle: 90
      length: 18

    - object: line
      type: flanker
      pos: [-27, 0]
      angle: 90
      length: 18
    - object: line
      type: target
      pos: [0, 0]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, 0]
      angle: 90
      length: 18

    - object: line
      type: flanker
      pos: [-27, -27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [0, -27]
      angle: 90
      length: 18
    - object: line
      type: flanker
      pos: [27, -27]
      angle: 90
      length: 18

